<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu ghi nhận sản lượng - T&B Logistics</title>
    <link rel="stylesheet" href="css/sanluong.css">
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">T&B Logistics</a>

    <nav class="navigation">
        <a href="#">About Us</a>
        <a href="index.html">Home Page</a>
        <a href="#">Career</a>
        <a href="#">Contact</a>
        <a href="login.html" class="login">Log In</a>
    </nav>
</header>

<main class="container">

    <h1 class="title">Phiếu ghi nhận sản lượng</h1>

    <table>
        <thead>
            <tr>
                <th>Mã số nhân viên</th>
                <th>Khách hàng</th>
                <th>Sản lượng</th>
                <th>Đơn vị</th>
                <th>Thao tác</th>
            </tr>
        </thead>

        <tbody id="employeeTable"></tbody>
    </table>

    <div class="button-area">
        <div class="left-buttons">
            <button type="button" class="btn btn-add" id="addEmployeeButton">
                + Thêm nhân viên
            </button>
        </div>

        <button type="button" class="btn btn-save" id="saveButton">
            💾 Lưu phiếu
        </button>
    </div>

    <div id="message" class="message"></div>

    <section id="savedInfo" class="saved-info" hidden>
        <h3>Thông tin phiếu đã lưu</h3>
        <div id="savedContent"></div>
    </section>

</main>

<script src="js/sanluong.js"></script>
</body>
</html>
