<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng nhập - T&B Logistics</title>

    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <main class="login-page">
      <div class="login-container">
        <a href="index.html" class="logo"> T&B Logistics </a>

        <h1 class="login-title">Đăng nhập</h1>

        <p class="login-subtitle">Đăng nhập để tiếp tục</p>

        <!-- Thông báo lỗi -->
        <div id="errorMessage" class="message error-message"></div>

        <!-- FORM LOGIN -->
        <form id="loginForm">
          <div class="form-group">
            <label for="username"> Tên đăng nhập </label>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Nhập tên đăng nhập"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password"> Mật khẩu </label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
              />

              <button type="button" id="togglePassword" class="toggle-password">
                Hiện
              </button>
            </div>
          </div>

          <div class="login-options">
            <label class="remember">
              <input type="checkbox" id="remember" />

              <span> Ghi nhớ đăng nhập </span>
            </label>

            <a href="#" class="forgot-password" id="forgotPassword">
              Quên mật khẩu?
            </a>
          </div>

          <button type="submit" id="loginButton" class="login-button">
            <span id="loginButtonText"> Log In </span>
          </button>
        </form>

        <!-- TÀI KHOẢN TEST -->
        <div class="test-account">
          <div class="test-title">Tài khoản TEST</div>

          <div class="test-info">
            <span>Username:</span>
            <strong>test</strong>
          </div>

          <div class="test-info">
            <span>Password:</span>
            <strong>123456</strong>
          </div>
        </div>

        <a href="index.html" class="back-home"> ← Quay lại trang chủ </a>
      </div>
    </main>

    <!-- QUAN TRỌNG -->
    <script src="js/login.js"></script>
  </body>
</html>
